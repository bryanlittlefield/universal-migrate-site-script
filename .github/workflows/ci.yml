name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck --version
      - run: shellcheck -x migrate.sh
      - run: shellcheck -s bash tests/stubs/bin/* tests/test_helper.bash
      - run: shellcheck gui.sh

  test:
    name: bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq bats; else brew install bats-core; fi
          bats --version
      - run: bats --tap tests
      - name: GUI tests
        run: python3 -m unittest discover -v -s tests -p 'test_gui.py'
